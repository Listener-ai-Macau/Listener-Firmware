<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">DIY Cute Keycap Base hardware envelope coordinate map</title>
  <desc id="desc">Top view coordinate map for a 120 by 50 millimeter base with four key sockets, one encoder, PCB, battery, USB-C, microphone, and BLE antenna keepout.</desc>
  <defs>
    <style>
      .base { fill: #f7f3ea; stroke: #2f3a42; stroke-width: 2; }
      .pcb { fill: #d9ead3; stroke: #38761d; stroke-width: 2; }
      .key { fill: #f4cccc; stroke: #990000; stroke-width: 2; }
      .enc { fill: #cfe2f3; stroke: #1155cc; stroke-width: 2; }
      .battery { fill: #fff2cc; stroke: #bf9000; stroke-width: 2; }
      .usb { fill: #d9d2e9; stroke: #674ea7; stroke-width: 2; }
      .mic { fill: #ead1dc; stroke: #a64d79; stroke-width: 2; }
      .ant { fill: #d0e0e3; stroke: #134f5c; stroke-width: 2; stroke-dasharray: 8 5; }
      .axis { stroke: #444; stroke-width: 1.5; marker-end: url(#arrow); }
      .grid { stroke: #c9c9c9; stroke-width: 1; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #1f2933; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #1f2933; }
      .dim { font-family: Arial, sans-serif; font-size: 13px; fill: #444; }
      .center { stroke: #333; stroke-width: 1; stroke-dasharray: 3 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Scale: 1 mm = 7 px. Drawing origin is mechanical (0,0), offset at (60,390), Y inverted. -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <g transform="translate(60,390)">
    <!-- Grid every 10 mm -->
    <g>
      <line class="grid" x1="0" y1="0" x2="840" y2="0"/>
      <line class="grid" x1="0" y1="-70" x2="840" y2="-70"/>
      <line class="grid" x1="0" y1="-140" x2="840" y2="-140"/>
      <line class="grid" x1="0" y1="-210" x2="840" y2="-210"/>
      <line class="grid" x1="0" y1="-280" x2="840" y2="-280"/>
      <line class="grid" x1="0" y1="-350" x2="840" y2="-350"/>
      <line class="grid" x1="0" y1="0" x2="0" y2="-350"/>
      <line class="grid" x1="70" y1="0" x2="70" y2="-350"/>
      <line class="grid" x1="140" y1="0" x2="140" y2="-350"/>
      <line class="grid" x1="210" y1="0" x2="210" y2="-350"/>
      <line class="grid" x1="280" y1="0" x2="280" y2="-350"/>
      <line class="grid" x1="350" y1="0" x2="350" y2="-350"/>
      <line class="grid" x1="420" y1="0" x2="420" y2="-350"/>
      <line class="grid" x1="490" y1="0" x2="490" y2="-350"/>
      <line class="grid" x1="560" y1="0" x2="560" y2="-350"/>
      <line class="grid" x1="630" y1="0" x2="630" y2="-350"/>
      <line class="grid" x1="700" y1="0" x2="700" y2="-350"/>
      <line class="grid" x1="770" y1="0" x2="770" y2="-350"/>
      <line class="grid" x1="840" y1="0" x2="840" y2="-350"/>
    </g>

    <rect class="base" x="0" y="-350" width="840" height="350" rx="56" ry="56"/>
    <rect class="pcb" x="35" y="-308" width="770" height="266" rx="10" ry="10"/>

    <!-- Battery: center 52,14; size 46x18 -->
    <rect class="battery" x="203" y="-161" width="322" height="126" rx="8" ry="8"/>
    <text class="label" x="270" y="-96">BAT 46 x 18</text>
    <text class="small" x="306" y="-78">(52,14)</text>

    <!-- Antenna keepout: X 88-116, Y 6-18 -->
    <rect class="ant" x="616" y="-126" width="196" height="84" rx="6" ry="6"/>
    <text class="label" x="642" y="-86">BLE ANT keepout</text>
    <text class="small" x="672" y="-68">X88-116 Y6-18</text>

    <!-- USB-C: center 60,0; shown protruding bottom -->
    <rect class="usb" x="385" y="-28" width="70" height="56" rx="5" ry="5"/>
    <text class="small" x="392" y="46">USB-C (60,0)</text>

    <!-- Microphone: center 18,12; size 10x6 -->
    <rect class="mic" x="91" y="-105" width="70" height="42" rx="6" ry="6"/>
    <circle cx="126" cy="-84" r="8" fill="#a64d79"/>
    <text class="small" x="83" y="-114">MIC (18,12)</text>

    <!-- Keys: centers 18,30; 42,30; 66,30; 90,30; size 18x18 -->
    <g>
      <rect class="key" x="63" y="-273" width="126" height="126" rx="12" ry="12"/>
      <line class="center" x1="126" y1="-282" x2="126" y2="-138"/>
      <line class="center" x1="54" y1="-210" x2="198" y2="-210"/>
      <text class="label" x="91" y="-214">KEY1</text>
      <text class="small" x="93" y="-195">(18,30)</text>
    </g>
    <g>
      <rect class="key" x="231" y="-273" width="126" height="126" rx="12" ry="12"/>
      <line class="center" x1="294" y1="-282" x2="294" y2="-138"/>
      <line class="center" x1="222" y1="-210" x2="366" y2="-210"/>
      <text class="label" x="259" y="-214">KEY2</text>
      <text class="small" x="261" y="-195">(42,30)</text>
    </g>
    <g>
      <rect class="key" x="399" y="-273" width="126" height="126" rx="12" ry="12"/>
      <line class="center" x1="462" y1="-282" x2="462" y2="-138"/>
      <line class="center" x1="390" y1="-210" x2="534" y2="-210"/>
      <text class="label" x="427" y="-214">KEY3</text>
      <text class="small" x="429" y="-195">(66,30)</text>
    </g>
    <g>
      <rect class="key" x="567" y="-273" width="126" height="126" rx="12" ry="12"/>
      <line class="center" x1="630" y1="-282" x2="630" y2="-138"/>
      <line class="center" x1="558" y1="-210" x2="702" y2="-210"/>
      <text class="label" x="595" y="-214">KEY4</text>
      <text class="small" x="597" y="-195">(90,30)</text>
    </g>

    <!-- Encoder: center 108,30; size 20x20 -->
    <g>
      <rect class="enc" x="686" y="-280" width="140" height="140" rx="70" ry="70"/>
      <circle cx="756" cy="-210" r="35" fill="none" stroke="#1155cc" stroke-width="2"/>
      <line class="center" x1="756" y1="-290" x2="756" y2="-130"/>
      <line class="center" x1="676" y1="-210" x2="836" y2="-210"/>
      <text class="label" x="725" y="-214">ENC</text>
      <text class="small" x="724" y="-195">(108,30)</text>
    </g>

    <!-- Axes -->
    <line class="axis" x1="0" y1="0" x2="890" y2="0"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="-395"/>
    <text class="label" x="870" y="-10">X</text>
    <text class="label" x="-20" y="-386">Y</text>
    <text class="small" x="-34" y="18">(0,0)</text>
    <text class="dim" x="375" y="24">120 mm</text>
    <text class="dim" x="-48" y="-168" transform="rotate(-90 -48,-168)">50 mm</text>
  </g>

  <g transform="translate(665,42)">
    <rect x="0" y="0" width="250" height="98" fill="#ffffff" stroke="#d0d0d0"/>
    <text class="label" x="12" y="22">Legend</text>
    <rect class="key" x="12" y="34" width="18" height="18"/><text class="small" x="38" y="48">Key socket envelope</text>
    <rect class="enc" x="12" y="58" width="18" height="18"/><text class="small" x="38" y="72">Encoder socket</text>
    <rect class="ant" x="12" y="82" width="18" height="10"/><text class="small" x="38" y="92">BLE antenna keepout</text>
  </g>
</svg>
