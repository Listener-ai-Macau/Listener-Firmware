name: Firmware feature request
description: Propose a device-level improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Product problem
      description: Describe the user or manufacturing problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired device behavior
      description: Include controls, LEDs, BLE compatibility, power impact, and recovery behavior when relevant.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance evidence
      description: Explain how hardware behavior should be verified.
